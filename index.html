<html>

    <head>
        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <section class="hero" id="home">
            <div class="hero-interaction" aria-hidden="true"></div>

            <div class="hero-bg"></div>
          
            <div class="hero-content">
              <div class="hero-time-pill" id="seattle-time">Seattle · --:--:--</div>

              <div class="hero-name-row">
                <h1 class="hero-name">Annie Chang</h1>
          
                <div class="hero-profile-card">
                  <img src="assets/heroPortrait1.png" alt="Annie Chang portrait" />
                </div>
              </div>
          
              <div class="hero-tagline-row">
                <span class="hero-tagline">Design</span>
          
                <div class="hero-badge-card">
                  <img src="assets/weitinglogomando.png"/>

                </div>
          
                <span class="hero-tagline">that Delivers</span>
              </div>
          
              <p class="hero-subtext">
                Product Designer who brings together systems thinking,<br />
                visual craft, and human insight to deliver meaningful results.
              </p>
            </div>
          </section>

        <script src="main.js"></script>

    </body>
</html>
